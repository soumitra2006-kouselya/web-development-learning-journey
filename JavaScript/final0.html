<h1>STUDENT FORM</h1>
<div class="divbox">
    <form >
        <label>Name</label> <input id="name" type="text">

        <label>Age</label> <input id="age" type="number">

        <label>Gender</label> 
        <div class="genderbox">
            <input type="radio" name="gender" value = male>Male
            <input type="radio" name="gender" value = female>Female
        </div>

        <label>Course</label> 
        <select id="course"> 
            <option>javascript</option>
            <option>javafullstack</option>
            <option>html</option>
            <option>css</option>            
        </select>

        <label>Email</label>
        <input id="email" type="email">

        <button type="button" onclick="save()">Save</button>
    </form>
</div>

<table class="tableLayout">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Course</th>
        <th>Email</th>
        <th>Action</th>
    </tr>
</table>


<style>
    body{
        text-align: center;
        font-family: Arial, sans-serif;
    }

    .divbox{
        width: 370px;
        padding: 15px;
        border: 2px solid gray;
        display: inline-block;
        margin: 20px auto;
        border-radius: 10px;
    }

    form{
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 8px;
    }

    input, select{
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    form button{
        background-color: aquamarine;  
        border: 5px black;
        padding: 8px;
        width: 100%;
        cursor: pointer; 
        grid-column: 1/3;       
    }

    .genderbox{
        display: flex;
        align-items: center;
        gap: 5px;
    }
    
    .tableLayout{
        margin: 20px auto;
        border-collapse: collapse;
    }

    th, td{
        border: 2px solid gray;
        padding: 10px;
    }

    th{
        text-transform: uppercase;
        background-color: white;
    }
    
    td button{
        background-color: red;
        color: white;
        border: none;
        padding: 5px;
        cursor: pointer;
    }
</style>


<Script>
    var inputname = document.getElementById("name")
    var age = document.getElementById("age")
    var course = document.getElementById("course")
    var email = document.getElementById("email")
    var tableLayout = document.querySelector(".tableLayout")
    function save(){
        var gender = document.querySelector("input[name='gender']:checked")
        if(gender == null){
            alert("Please select the Gender!")
            return
        }
        var row = document.createElement("tr")
        var nameCell = document.createElement("td")
        nameCell.textContent = inputname.value
        var ageCell = document.createElement("td")
        ageCell.textContent = age.value
        var genderCell = document.createElement("td")
        genderCell.textContent = gender.value
        var courseCell = document.createElement("td")
        courseCell.textContent = course.value
        var emailCell = document.createElement("td")
        emailCell.textContent = email.value
        var actionCell = document.createElement("td")
        var btn = document.createElement("button")
        btn.textContent = "delete"
        actionCell.append(btn)      
        btn.onclick=function(){
            row.remove()
        }
        row.append(nameCell, ageCell, genderCell, courseCell, emailCell, actionCell)
        tableLayout.append(row)
        inputname.value = ""
        age.value = ""
        gender.checked = false
        course.value = ""
        email.value = ""
    }

    function deletefun(event){
        event.target.parentElement.remove()
    }
</Script>
