<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fav❤️Book</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar">
        <h1>Favourite 👌 Books</h1>
    </div>
    <div class="box">
        <div class="smallBox">
            <h2>Rich dad Poor dad</h2>
            <h5>-Carol</h5>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. At inventore nisi corporis maiores. Velit, sed asperiores minus eaque assumenda perspiciatis laborum, aliquid inventore, veritatis corrupti enim quo qui. Repellat, nobis?</p>
            <button id="delete" onclick="deleteSmallBox(event)">delete</button>
        </div>
    </div>
    <div class="popupOverlay"></div>
    <div class="popupBox">
        <h2>Add Book</h2>
        <form>
            <input id="bookTitle" type="text" placeholder="Book Title">
            <input id="bookAuthor" type="text" placeholder="Book Author">
            <textarea id="shortDescription" placeholder="Short Description"></textarea>
            <button id="addBtn">ADD</button>
            <button id="cancelBtn">CANCEL</button>
        </form>
    </div>
    <button class="plusBtn">+</button>
    <script src="script.js"></script>
</body>
</html>
